[package]
name = "siftwave"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rmcp = { version = "3.2.0", features = ["transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "1.1.5"

[dev-dependencies]
tempfile = "3.27.0"
